[package]
name = "piaso-rust"
version = "0.3.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Rust acceleration for PIASO: gene-set scoring + scATAC peak calling + quantification + fragment import"

# Keep the rendered documentation out of the source distribution. maturin
# builds the sdist from this cargo package, so without the exclude it picked up
# docs/ -- 469 MB of tutorial images out of a 471 MB archive. PyPI refuses any
# file over 100 MB, so the upload failed on the sdist *after* the three wheels
# had gone up: a red build on every release since 1.2.0, and no sdist on PyPI
# for any of them. The docs are published to the website, not to PyPI.
exclude = ["docs/**", "web/**", "benchmarks/**", "notebooks/**", "*.ipynb"]

[lib]
name = "_piaso"
crate-type = ["cdylib", "rlib"]

# Unpublished method kernels are OFF by default, so a wheel built from this
# crate exports only the score and motif-scan functions. A compiled extension
# cannot be partially shipped -- withholding the .rs files from a public repo
# would NOT withhold the capability from the wheel, because the registered
# symbols are callable machine code. Build internally with:
#     maturin develop --features internal
# The public tree (publish.sh) drops the picco and quantify features with the
# sources they gate; the cfg checks that name them stay in lib.rs. Tell rustc
# those values are expected so the public build is warning-free.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("picco", "quantify", "internal"))'] }

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "generate-import-lib"] }
numpy = "0.29"
rayon = "1.10"
# piaso-atac + quantify dependencies
rusqlite = { version = "0.31", features = ["bundled"] }
lz4_flex = "0.11"
zstd = "0.13"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "2.0"
libc = "0.2"
pythonize = "0.29"
# cytome-import-fragments dependency (pure-Rust bgzf reader)
noodles-bgzf = "0.46"
noodles-tabix = "0.67.0"
noodles-csi = "0.61.0"
