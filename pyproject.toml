[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "piaso-tools"
version = "1.2.0"
description = "Precise Integrative Analysis of Single-cell Omics."
requires-python = ">=3.9"
license = {text = "BSD-3-Clause"}
authors = [
    { name = "Min Dai", email = "dai@broadinstitute.org" }
]
maintainers = [
    { name = "Min Dai", email = "dai@broadinstitute.org" },
    { name = "Vallari Shende", email = "vshende@broadinstitute.org" }
]
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "anndata>=0.8",
    "numpy>=1.21.6",
    "matplotlib>=3.5.2",
    "pandas>=1.4.4",
    "scipy>=1.7.3",
    "seaborn>=0.11.2",
    "scikit-learn>=1.1",
    "statsmodels>=0.13.2",
    "tqdm",
    "typing-extensions",
    "requests",
    "lz4",
    "zstandard",
    "h5py",
    "umap-learn>=0.5",
    "igraph>=0.10",
    "cosg>=1.0.3",
]

# https://docs.pypi.org/project_metadata/#project-urls
[project.urls]
Documentation = "https://piaso.org"
Source = "https://github.com/genecell/PIASO"
Homepage = "https://piaso.org"

[project.optional-dependencies]
dev = [
    "pre-commit", # static checking
]
cytome = [
    "cytome>=0.2.1",
]
atac = [
    "pysam",
]
harmony = [
    "harmonypy>=0.0.6",
]
leiden = [
    "leidenalg>=0.9",
]
scanpy = [
    "scanpy>=1.9.1",  # optional: for interop with scanpy-based workflows
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "piaso._piaso"
