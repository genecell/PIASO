[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "piaso-tools"
version = "1.2.8"
description = "Precise Integrative Analysis of Single-cell Omics."
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
    { name = "Min Dai", email = "dai@broadinstitute.org" }
]
maintainers = [
    { name = "Min Dai", email = "dai@broadinstitute.org" },
    { name = "Vallari Shende", email = "vshende@broadinstitute.org" }
]
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    # What CI builds wheels for and tests: Linux x86_64, CPython 3.10 to 3.12. Elsewhere pip
    # builds from the sdist (Rust needed), on platforms nobody has run PIASO on yet.
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "anndata>=0.8",
    "numpy>=1.21.6",
    # >=3.6: matplotlib.colormaps.get_cmap (plotEmbedding's categorical colormaps); on 3.5 the
    # call failed inside a try and the colormap a user named was silently ignored.
    "matplotlib>=3.6",
    # No upper bound. pandas 3 turns on `future.infer_string`, so a string
    # column is StringDtype rather than object -- which broke dtype dispatch
    # until the checks stopped asking numpy about a pandas extension dtype.
    # The suite passes on 3.x; capping here would have made PIASO
    # uninstallable beside anything that requires it, for a problem that was
    # ours and is fixed.
    "pandas>=1.4.4",
    "scipy>=1.7.3",
    "seaborn>=0.11.2",
    "scikit-learn>=1.1",
    "statsmodels>=0.13.2",
    "tqdm",
    "typing-extensions",
    "requests",
    "lz4",
    "zstandard",
    "h5py",
    # >=0.5.8, not >=0.5: earlier versions call scikit-learn's
    # check_array(force_all_finite=...), which scikit-learn renamed in 1.6 and
    # removed in 1.8, so umap-learn 0.5.6 + scikit-learn >=1.8 raises a
    # TypeError from inside sklearn with no mention of umap. Fixed upstream in
    # 0.5.8; a floor is the right tool because the fix exists and is available.
    "umap-learn>=0.5.8",
    "igraph>=0.10",
    # >=1.1.0, not 1.0.3: runGDR's cytome path calls cosg.run_cosg_cytome,
    # which does not exist before 1.1.0. The import is lazy, so a stale cosg
    # does not break `import piaso` -- it fails partway through a GDR run with
    # ModuleNotFoundError, which is the worst time to find out.
    # Floor 1.2.1: COSG before 1.2.1 scored a group with no cell in a batch, so
    # runGDR(batch_key=..., groupby=...) and predictCellTypeByGDR (reference and
    # query as two batches) gained a marker set of unrelated genes, one noise
    # dimension of X_gdr, per batch-group pair without cells
    # (tests/test_gdr_batch_missing_group.py); 1.2.0's dense output, which
    # specificity_matrix reads on a cytome, fails under pandas 3 ("assignment
    # destination is read-only"); and 1.2.1 reads a cytome's column-major
    # matrices.
    "cosg>=1.2.1",
    # Required, not optional. PIASO reads cytome datasets throughout tl/pp/pl,
    # and cytome is a 124 KB pure-Python wheel whose own dependencies (numpy,
    # scipy, pandas, lz4) are all already listed above -- so requiring it adds
    # exactly one package and no transitive weight.
    # Upper bound: cytome's public modality API is pinned by its own
    # conformance test, so 0.x minors are safe; the bound exists to stop a
    # future 1.0 API cleanup from reaching installs pinned to this release.
    # Floor 0.3.6: graphs stored in chunks (the neighbour graph that leiden and
    # umap read comes back in 1 s instead of 101 s at 2.3 million cells), the
    # read-only mode the plotting functions open stores with, column writes
    # in one pass, ds.split for leiden_local, and the chunk source runSVD
    # computes on. PIASO still runs on an older cytome (each of these falls
    # back), but slower, and a read-only store would not open.
    # Floor 0.3.7: piaso.data.makeGenomeFiles reads the reference's GTF with
    # cytome.read_gtf, new in 0.3.7 (one reader for GENCODE, Ensembl, NCBI
    # RefSeq and plain GTF 2.2), and raises ImportError on an older cytome.
    # Floor 0.3.9: the cytome this release was tested with, released with it
    # (cytome's own audit of 2026-10-27: writes that never stop half done,
    # categoricals and missing labels that round-trip, readers that never
    # write). No PIASO call needs a function new in 0.3.9; the suite passes on
    # 0.3.8 too.
    "cytome>=0.3.9,<1.0",
]

# https://docs.pypi.org/project_metadata/#project-urls
[project.urls]
Documentation = "https://piaso.org"
Source = "https://github.com/genecell/PIASO"
Homepage = "https://piaso.org"

[project.optional-dependencies]
# Optional, NOT required. numba's `default` threading layer already resolves to
# omp -- which is thread-safe and is what runGDR's per-batch pool needs -- and
# numba's own wheel ships the omp pool, so the parallel path is on out of the
# box. tbb only matters if something in your environment pins
# NUMBA_THREADING_LAYER='tbb', or you specifically prefer the tbb pool. Note the
# wheel installs shared objects into <prefix>/lib rather than a Python package,
# which resolves under conda but may not under a plain venv.
tbb = [
    "tbb>=2021.0; (platform_machine == 'x86_64' or platform_machine == 'AMD64') and sys_platform != 'darwin'",
]
dev = [
    "pre-commit", # static checking
]
atac = [
    "pysam",
]
harmony = [
    "harmonypy>=0.0.6",
]
leiden = [
    "leidenalg>=0.9",
]
scanpy = [
    "scanpy>=1.9.1",  # optional: for interop with scanpy-based workflows
]

[tool.maturin]
# picco and quantify gate call_peaks_pyo3 and quantify_peaks_pyo3. Without
# them the extension still builds and imports -- it simply has no such
# symbols, so the failure surfaces later as an ImportError from inside
# quantifyPeakActivity rather than as a build error. publish.sh drops them
# again for the public tree, where the sources they gate do not ship.
features = ["pyo3/extension-module"]
module-name = "piaso._piaso"

[tool.pytest.ini_options]
testpaths = ["tests", "piaso/tests"]
# An unregistered marker is an error, not a silently unselectable test. The markers are
# described in tests/conftest.py, which also registers them for a copy of tests/ run alone.
addopts = "--strict-markers"
markers = [
    "data(*paths): needs these files from the data roots (PIASO_TEST_DATA, PIASO_TEST_RESULTS); skipped without them, failed with PIASO_REQUIRE_DATA=1",
    "requires_e18: needs the E18 store built by the workflow (data(E18_CYTOME))",
    "snakemake: runs Snakemake (PIASO_SNAKEMAKE or PATH); skipped without it",
    "network: may download (PIASO-data, Zenodo); skipped when the download fails",
    "slow: a call of 20 s or more (tests/slow_tests.txt); deselect with -m 'not slow'",
]
